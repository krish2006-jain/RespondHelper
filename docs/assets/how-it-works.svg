<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 220" role="img" aria-labelledby="hiw">
  <title id="hiw">How RespondHelper works in three steps</title>
  <rect width="1080" height="220" fill="#FAF7F2"/>

  <!-- Card 1 -->
  <rect x="8" y="16" width="320" height="188" rx="12" fill="#FFFFFF" stroke="#E6E0D6"/>
  <circle cx="48" cy="52" r="20" fill="#C8352B"/>
  <text x="48" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">1</text>
  <text x="80" y="58" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#1F2933">Ask for help</text>
  <text x="32" y="100" font-family="system-ui, sans-serif" font-size="15" fill="#5B6770">SOS in three taps: location,</text>
  <text x="32" y="122" font-family="system-ui, sans-serif" font-size="15" fill="#5B6770">what you need, send. Photos</text>
  <text x="32" y="144" font-family="system-ui, sans-serif" font-size="15" fill="#5B6770">and extra details stay optional.</text>
  <text x="32" y="176" font-family="system-ui, sans-serif" font-size="13" fill="#0F5C5C">Survivor dashboard</text>

  <!-- Card 2 -->
  <rect x="380" y="16" width="320" height="188" rx="12" fill="#FFFFFF" stroke="#E6E0D6"/>
  <circle cx="420" cy="52" r="20" fill="#0F5C5C"/>
  <text x="420" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">2</text>
  <text x="452" y="58" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#1F2933">Get matched</text>
  <text x="404" y="100" font-family="system-ui, sans-serif" font-size="15" fill="#5B6770">Score nearby volunteers and</text>
  <text x="404" y="122" font-family="system-ui, sans-serif" font-size="15" fill="#5B6770">stock by distance, skills,</text>
  <text x="404" y="144" font-family="system-ui, sans-serif" font-size="15" fill="#5B6770">urgency, quantity, workload.</text>
  <text x="404" y="176" font-family="system-ui, sans-serif" font-size="13" fill="#0F5C5C">Great / Good / Possible</text>

  <!-- Card 3 -->
  <rect x="752" y="16" width="320" height="188" rx="12" fill="#FFFFFF" stroke="#E6E0D6"/>
  <circle cx="792" cy="52" r="20" fill="#E8A33D"/>
  <text x="792" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1F2933">3</text>
  <text x="824" y="58" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#1F2933">Track live</text>
  <text x="776" y="100" font-family="system-ui, sans-serif" font-size="15" fill="#5B6770">Status timeline, map pins,</text>
  <text x="776" y="122" font-family="system-ui, sans-serif" font-size="15" fill="#5B6770">and notifications update over</text>
  <text x="776" y="144" font-family="system-ui, sans-serif" font-size="15" fill="#5B6770">Socket.io  no refresh needed.</text>
  <text x="776" y="176" font-family="system-ui, sans-serif" font-size="13" fill="#0F5C5C">Submitted ’ Resolved</text>
</svg>
