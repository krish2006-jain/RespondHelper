<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">RespondHelper  Relief Network</title>
  <desc id="desc">Banner for the disaster management and emergency response platform</desc>
  <rect width="1200" height="320" fill="#FAF7F2"/>
  <rect x="0" y="0" width="8" height="320" fill="#0F5C5C"/>
  <rect x="0" y="312" width="1200" height="8" fill="#0F5C5C"/>

  <text x="56" y="78" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#0F5C5C" letter-spacing="3">RELIEF NETWORK</text>
  <text x="56" y="138" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="700" fill="#1F2933">RespondHelper</text>
  <text x="56" y="182" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" fill="#5B6770">Help, when it is needed most.</text>
  <text x="56" y="230" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" fill="#5B6770">Survivors raise requests. Verified volunteers, NGOs,</text>
  <text x="56" y="254" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" fill="#5B6770">shelters and suppliers respond in real time.</text>

  <!-- SOS chip -->
  <rect x="56" y="272" width="132" height="28" rx="14" fill="#C8352B"/>
  <text x="122" y="291" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">I need help</text>
  <rect x="198" y="272" width="128" height="28" rx="14" fill="none" stroke="#0F5C5C" stroke-width="2"/>
  <text x="262" y="291" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#0F5C5C">I want to help</text>

  <!-- Stylised map card -->
  <rect x="780" y="40" width="360" height="240" rx="14" fill="#FFFFFF" stroke="#E6E0D6" stroke-width="2"/>
  <path d="M800 88h320 M800 136h320 M800 184h320 M800 232h320" stroke="#E6E0D6" stroke-width="1"/>
  <path d="M848 56v200 M920 56v200 M992 56v200 M1064 56v200" stroke="#E6E0D6" stroke-width="1"/>
  <path d="M820 220 C860 180, 900 200, 940 150 S1020 120, 1100 90" fill="none" stroke="#0F5C5C" stroke-width="3" stroke-linecap="round"/>

  <!-- Markers: critical, volunteer, ngo, shelter, resource -->
  <g transform="translate(900,118)">
    <path d="M0,-22 C-10,-22 -16,-14 -16,-6 C-16,6 0,22 0,22 C0,22 16,6 16,-6 C16,-14 10,-22 0,-22Z" fill="#C8352B"/>
    <circle cy="-8" r="5" fill="#FAF7F2"/>
  </g>
  <g transform="translate(980,168)">
    <path d="M0,-22 C-10,-22 -16,-14 -16,-6 C-16,6 0,22 0,22 C0,22 16,6 16,-6 C16,-14 10,-22 0,-22Z" fill="#2F8F5B"/>
    <circle cy="-8" r="5" fill="#FAF7F2"/>
  </g>
  <g transform="translate(1048,108)">
    <path d="M0,-22 C-10,-22 -16,-14 -16,-6 C-16,6 0,22 0,22 C0,22 16,6 16,-6 C16,-14 10,-22 0,-22Z" fill="#2B6CB0"/>
    <circle cy="-8" r="5" fill="#FAF7F2"/>
  </g>
  <g transform="translate(860,188)">
    <path d="M0,-22 C-10,-22 -16,-14 -16,-6 C-16,6 0,22 0,22 C0,22 16,6 16,-6 C16,-14 10,-22 0,-22Z" fill="#6B4FA0"/>
    <circle cy="-8" r="5" fill="#FAF7F2"/>
  </g>
  <g transform="translate(1088,198)">
    <path d="M0,-22 C-10,-22 -16,-14 -16,-6 C-16,6 0,22 0,22 C0,22 16,6 16,-6 C16,-14 10,-22 0,-22Z" fill="#E8A33D"/>
    <circle cy="-8" r="5" fill="#FAF7F2"/>
  </g>
  <circle cx="940" cy="150" r="8" fill="#0F5C5C" opacity="0.2"/>
  <circle cx="940" cy="150" r="4" fill="#0F5C5C"/>
</svg>
